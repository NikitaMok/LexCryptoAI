name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — целевая версия прод-образа, 3.13 — версия машины разработки
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # без chromadb/langgraph: unit-тесты не требуют тяжёлого стека.
          # pdfplumber и python-docx нужны для чтения тестовых контрактов;
          # запись фикстур вынесена в scripts/make_test_fixtures.py и в CI не выполняется
          pip install fastapi==0.115.6 pydantic==2.10.4 pydantic-settings==2.7.0 \
            httpx==0.28.1 loguru==0.7.3 python-dotenv==1.0.1 PyYAML==6.0.2 \
            pdfplumber==0.11.4 python-docx==1.2.0
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app tests --select E,F --ignore E501

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q
