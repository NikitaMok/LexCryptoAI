# Машиночитаемое зеркало docs/RULES_SPEC.md.
# Состав кодов, серьёзность и ссылки на нормы должны совпадать со спецификацией:
# синхронность проверяется тестом tests/test_rules_config.py.
#
# Поле check указывает имя детерминированной проверки из app/rules/predicates.py.
# Значение null означает, что правило спроектировано юристом, но требует
# ручной оценки: автоматизировать его либо нельзя, либо ещё нечем.

version: "1.3"
updated: "2026-08-31"

legal_basis:
  - "Федеральный закон от 04.08.2026 № 282-ФЗ «О цифровых валютах и цифровых правах»"
  - "Федеральный закон от 04.08.2026 № 283-ФЗ"
  - "Федеральный закон от 07.08.2001 № 115-ФЗ"
  - "Федеральный закон от 10.12.2003 № 173-ФЗ"
  - "Инструкция Банка России от 16.08.2017 № 181-И"

groups:
  A: "Квалификация договора"
  B: "Актив"
  C: "Адреса и порядок расчётов"
  D: "Курс и момент исполнения"
  E: "Реквизиты сторон"
  F: "Пороги и контроль"
  G: "Риски и AML"
  H: "Документооборот и отчётность"

rules:
  # --- A. Квалификация договора ---
  - code: FTC-001
    group: A
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Договор прямо квалифицирован как внешнеторговый, заключённый между резидентом и нерезидентом"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 1"}
      - {act: "282-ФЗ", ref: "ст. 31 ч. 5 п. 6"}
    sanction: "Расчёты попадают под запрет ч. 6 ст. 1; отказ цифрового депозитария в зачислении; отказ банка в постановке на учёт"
    check: {predicate: foreign_trade_qualified}
    example_bad: "Покупатель оплачивает Товар в USDT."
    example_good: "Настоящий Договор является внешнеторговым договором (контрактом), заключённым между Покупателем — резидентом Российской Федерации и Поставщиком — нерезидентом, и предусматривает передачу Товара. Расчёты производятся цифровой валютой на основании пункта 1 части 7 статьи 1 Федерального закона от 04.08.2026 № 282-ФЗ."

  - code: FTC-002
    group: A
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Предмет договора — передача товаров, информации, результатов интеллектуальной деятельности, выполнение работ или оказание услуг"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 1"}
    sanction: "Сделка не подпадает под исключение из запрета; операция признаётся недопустимой"
    check: {predicate: subject_matter_declared}

  - code: FTC-003
    group: A
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Резидентство каждой стороны определимо из текста договора"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 1"}
    sanction: "Невозможность подтвердить состав сторон исключения; запрос банка, приостановка операции"
    check: {predicate: parties_identified}

  - code: FTC-004
    group: A
    severity: advisory
    effective_from: "2026-09-01"
    title: "Если сторона действует как агент, комиссионер или поверенный — указано, в чьих интересах и по какому договору"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 8"}
    sanction: "Спор о применимости исключения к посреднику"
    check: {predicate: intermediary_capacity}
    example_bad: "Покупатель действует как агент. В чьих интересах — не указано."
    example_good: "Если сторона действует как агент, комиссионер или поверенный, она указывает договор, в интересах которого действует, и лицо, в чьих интересах совершаются операции."

  - code: FTC-005
    group: A
    severity: advisory
    effective_from: "2026-09-01"
    title: "В договоре есть прямая ссылка на п. 1 ч. 7 ст. 1 № 282-ФЗ как на основание расчётов цифровой валютой"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 1"}
    sanction: "Дополнительные запросы банка при постановке на учёт"
    check: {predicate: cites_exemption}

  # --- B. Актив ---
  - code: AST-001
    group: B
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Цифровая валюта идентифицирована однозначно: наименование, тикер, сеть и стандарт токена, эмитент"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 2 ч. 1 п. 1"}
    sanction: "Невозможность идентифицировать предмет платежа; риск переквалификации операции"
    check: {predicate: asset_identified}
    example_bad: "Оплата производится в стейблкоинах."
    example_good: "Оплата производится цифровой валютой Tether USD (тикер USDT), эмитент Tether Limited, в сети TRON, стандарт токена TRC-20."

  - code: AST-002
    group: B
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Указано, что цифровая валюта используется как средство платежа либо встречное предоставление именно по этому договору"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 1"}
      - {act: "282-ФЗ", ref: "ст. 31 ч. 5 п. 6"}
    sanction: "Отказ депозитария в зачислении: отсутствует основание, предусмотренное п. 6 ч. 5 ст. 31"
    check: {predicate: payment_purpose_declared}

  - code: AST-003
    group: B
    severity: advisory
    effective_from: "2026-09-01"
    title: "Оговорены последствия утраты стейблкоином привязки к базовому активу и делистинга"
    norm_refs: []
    sanction: "Неурегулированный спор о сумме исполнения при отклонении курса стейблкоина"
    check: {predicate: depeg_and_delisting}
    example_bad: "Оплата в USDT. Последствия утраты привязки не оговорены."
    example_good: "Если цифровая валюта утратит привязку к базовому активу либо будет исключена из обращения (делистинг), количество единиц для оплаты определяется по рыночной котировке на дату списания; разница подлежит доплате или возврату в течение пяти рабочих дней."

  - code: AST-004
    group: B
    severity: advisory
    effective_from: "2026-09-01"
    title: "Если актив является иностранным цифровым инструментом — учтено, что к нему применяются правила о цифровых валютах"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 4"}
      - {act: "115-ФЗ", ref: "ст. 3 ч. 7-8"}
    sanction: "Применение неверного правового режима к активу"
    check: {predicate: foreign_digital_instrument}
    example_bad: "Оплата производится цифровой валютой Tether USD (тикер USDT)."
    example_good: "Стороны исходят из того, что указанная цифровая валюта является иностранным цифровым инструментом; к ней применяются положения, установленные в отношении цифровых валют."

  # --- C. Адреса и порядок расчётов ---
  - code: ADR-001
    group: C
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Адрес получателя указан как адрес-идентификатор, доступ к которому предоставляет цифровой депозитарий, а не как «сырой» адрес кошелька"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 24 ч. 1-2"}
      - {act: "282-ФЗ", ref: "ст. 17"}
    sanction: "Блокировка по 115-ФЗ; отказ банка в постановке на учёт; невозможность подтвердить обладание активом"
    check: {predicate: identifier_address_used}
    example_bad: "Оплата производится на кошелёк TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE."
    example_good: "Оплата производится на адрес-идентификатор, доступ к которому предоставляет ООО «…» — цифровой депозитарий, включённый в реестр Банка России (реестровый номер …). Адрес-идентификатор указывается сторонами в Дополнительном соглашении и подтверждается выпиской цифрового депозитария."

  - code: ADR-002
    group: C
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Цифровой депозитарий назван с реестровыми данными, позволяющими проверить его право на деятельность"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 17"}
      - {act: "282-ФЗ", ref: "ст. 52"}
    sanction: "Расчёты через лицо без права на деятельность; последствия по ст. 21"
    check: {predicate: depositary_registry_reference}

  - code: ADR-003
    group: C
    severity: advisory
    effective_from: "2026-09-01"
    title: "Предусмотрено право требовать выписку цифрового депозитария как подтверждение обладания"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 24 ч. 4"}
    sanction: "Отсутствие доказательства обладания активом в споре и перед банком"
    check: {predicate: depositary_statement_right}

  - code: ADR-004
    group: C
    severity: advisory
    effective_from: "2026-09-01"
    title: "Если используется адрес-идентификатор, не администрируемый депозитарием, — оговорена обязанность отчётности в налоговые органы"
    norm_refs:
      - {act: "173-ФЗ", ref: "ст. 12.1"}
    sanction: "Нарушение порядка представления отчётов о совершении операций с цифровыми валютами"
    check: {predicate: noncustodial_tax_reporting}
    example_good: "При использовании адреса-идентификатора, не администрируемого цифровым депозитарием, Покупатель представляет в налоговый орган по месту учёта отчёты о совершении операций с цифровыми валютами в порядке, установленном Правительством Российской Федерации."

  - code: ADR-005
    group: C
    severity: mandatory
    effective_from: "2027-07-01"
    title: "Если расчёты идут не через лицо, организующее обращение цифровых валют, внешнеторговое основание зафиксировано явно"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 30 ч. 1 п. 2"}
    sanction: "Сделка совершена в нарушение порядка, установленного ч. 1 ст. 30"
    check: null

  # --- D. Курс и момент исполнения ---
  - code: RTE-001
    group: D
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Способ определения курса зафиксирован: источник котировки и момент фиксации"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 34"}
    sanction: "Спор о сумме исполнения; замечания валютного контроля"
    check: {predicate: rate_source_fixed}

  - code: RTE-002
    group: D
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Момент исполнения денежного обязательства привязан к внесению записи в информационную систему, в которой учитывается цифровая валюта"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 30 ч. 3"}
    sanction: "Спор об исполнении обязательства при незавершённой транзакции"
    check: {predicate: record_moment_clause}
    example_bad: "Обязательство по оплате считается исполненным с момента отправки Покупателем перевода."
    example_good: "Обязательство по оплате считается исполненным с момента внесения записи о зачислении цифровой валюты на адрес-идентификатор Поставщика в информационной системе, в которой учитывается указанная цифровая валюта (часть 3 статьи 30 Федерального закона от 04.08.2026 № 282-ФЗ)."

  - code: RTE-003
    group: D
    severity: advisory
    effective_from: "2026-09-01"
    title: "Распределены расходы на комиссии информационной системы"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 1 ч. 7 п. 3"}
    sanction: "Недоплата по договору на сумму сетевой комиссии"
    check: {predicate: network_fees_allocated}

  - code: RTE-004
    group: D
    severity: advisory
    effective_from: "2026-09-01"
    title: "Установлен допустимый предел отклонения курса и порядок доплаты либо возврата разницы"
    norm_refs: []
    sanction: "Спор о курсовой разнице"
    check: {predicate: rate_deviation_limit}
    example_good: "Отклонение курса, определённого по настоящему Договору, от фактически применённого при списании более чем на 0,5 процента влечёт доплату или возврат разницы в течение пяти рабочих дней."

  # --- E. Реквизиты сторон ---
  - code: TRV-001
    group: E
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Для стороны-юридического лица указаны наименование, номер цифрового счёта или адреса-идентификатора, государство и город местонахождения, ИНН"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 1 подп. 2"}
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 1 подп. 4"}
    sanction: "Депозитарий обязан отказать в исполнении поручения (п. 5 ст. 7.2-1)"
    check: {predicate: party_details_present}

  - code: TRV-002
    group: E
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Если сумма операции превышает 60 000 рублей — состав сведений соответствует расширенному перечню"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 1"}
    sanction: "Отказ в исполнении поручения; отклонение операции принимающей стороной"
    check: {predicate: party_details_above_travel_rule_threshold}

  - code: TRV-003
    group: E
    severity: advisory
    effective_from: "2026-09-01"
    title: "Установлена обязанность сторон актуализировать реквизиты и последствия непредоставления сведений"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 5"}
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 9"}
    sanction: "Приостановка операции до получения полного состава сведений"
    check: {predicate: details_update_obligation}
    example_good: "Стороны актуализируют реквизиты не позднее трёх рабочих дней с момента их изменения. При отсутствии полного состава сведений цифровой депозитарий отказывает в исполнении поручения."

  # --- F. Пороги и контроль ---
  - code: THR-001
    group: F
    severity: mandatory
    effective_from: "2026-09-01"
    title: "При сумме операции от 10 000 000 рублей контракт содержит условия, обеспечивающие прохождение обязательного контроля"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 6 п. 1.12"}
    sanction: "Операция подлежит обязательному контролю; запросы Росфинмониторинга, приостановка"
    check: {predicate: mandatory_control_readiness}

  - code: THR-002
    group: F
    severity: mandatory
    effective_from: "2026-09-01"
    title: "При сумме импортного контракта от 3 000 000 рублей предусмотрена постановка на учёт в уполномоченном банке"
    norm_refs:
      - {act: "181-И", ref: "п. 4.3"}
      - {act: "181-И", ref: "п. 5.1"}
    sanction: "Отказ банка в проведении операции; административная ответственность по ст. 15.25 КоАП РФ"
    check: {predicate: bank_registration_clause}
    example_bad: "Стоимость оборудования составляет 12 000 000 рублей. Порядок постановки контракта на учёт в договоре не оговорён."
    example_good: "Покупатель обеспечивает постановку настоящего Договора на учёт в уполномоченном банке в соответствии с Инструкцией Банка России от 16.08.2017 № 181-И до совершения первого платежа."

  - code: THR-003
    group: F
    severity: advisory
    effective_from: "2026-09-01"
    title: "Отсутствуют признаки искусственного дробления платежей для ухода из-под порога"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 6 п. 1.12"}
      - {act: "115-ФЗ", ref: "ст. 7 п. 2"}
    sanction: "Квалификация операций как подозрительных; блокировка"
    check: {predicate: no_payment_splitting}
    example_good: "Платежи по Договору производятся в сроки и размерах, соответствующих графику поставки Товара."

  # --- G. Риски и AML ---
  - code: AML-001
    group: G
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Распределены риски заморозки или отклонения операции, в том числе иностранным контрагентом и иностранной организацией финансового рынка"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 35"}
      - {act: "115-ФЗ", ref: "ст. 7.2-1 п. 9"}
    sanction: "Убытки от заморозки относятся на сторону, не защищённую договором"
    check: {predicate: risk_allocation_clause}

  - code: AML-002
    group: G
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Адрес-идентификатор контрагента не администрируется организацией из государства, не выполняющего рекомендации ФАТФ, либо это прямо оговорено"
    norm_refs:
      - {act: "115-ФЗ", ref: "ст. 6 п. 1 подп. 2"}
    sanction: "Обязательный контроль независимо от суммы операции"
    check: {predicate: fatf_jurisdiction_addressed}
    example_bad: "Оплата производится на адрес биржи, зарегистрированной в Иране."
    example_good: "Стороны исходят из того, что адрес-идентификатор Поставщика не администрируется организацией финансового рынка, зарегистрированной в государстве, не выполняющем рекомендации ФАТФ. Если иное будет установлено, операция подлежит обязательному контролю независимо от суммы (подпункт 2 пункта 1 статьи 6 Федерального закона № 115-ФЗ)."

  - code: AML-003
    group: G
    severity: advisory
    effective_from: "2026-09-01"
    title: "Предусмотрено право приостановить исполнение при выявлении признаков повышенного риска"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 35"}
    sanction: "Обязанность исполнить платёж при известном риске заморозки"
    check: {predicate: suspension_right}

  - code: AML-004
    group: G
    severity: advisory
    effective_from: "2026-09-01"
    title: "Контрагент заверяет о происхождении цифровой валюты и отсутствии связи с противоправной деятельностью"
    norm_refs:
      - {act: "282-ФЗ", ref: "ст. 35 ч. 1"}
    sanction: "Отсутствие основания для регресса при выявлении связи актива с противоправной деятельностью"
    check: {predicate: origin_representation}

  # --- H. Документооборот и отчётность ---
  - code: RPT-001
    group: H
    severity: mandatory
    effective_from: "2026-09-01"
    title: "Установлена обязанность сторон предоставлять подтверждающие документы по операциям с цифровой валютой"
