# Нормы № 115-ФЗ и № 173-ФЗ в редакции Федерального закона от 04.08.2026 № 283-ФЗ.
#
# Тексты 282-ФЗ разбираются автоматически из выгрузки закона, а эти два акта
# 283-ФЗ правит, а не излагает целиком: в его тексте есть только вносимые
# формулировки. Поэтому нормы выверены вручную по тексту 283-ФЗ и приведены
# здесь дословно.
#
# Записи без текста означают признанный пробел корпуса: норма процитирована
# в матрице, но её текст не выверен. Пересказывать норму по памяти нельзя.

norms:
  # --- 115-ФЗ ---
  - act: "115-ФЗ"
    article: "3"
    part: "7-8"
    article_title: "Основные понятия, используемые в настоящем Федеральном законе"
    source: "283-ФЗ, ст. 7 п. 1 подп. «б»"
    text: >-
      Используемые в настоящем Федеральном законе понятия «адрес-идентификатор»,
      «цифровые валюты», «иностранные цифровые инструменты», «договор цифрового
      учета», «договор о предоставлении доступа к адресу-идентификатору»
      применяются в тех значениях, в каких они используются в законодательстве
      Российской Федерации о цифровых валютах и цифровых правах. Для целей
      настоящего Федерального закона к иностранным цифровым инструментам
      применяются положения, установленные в отношении цифровых валют.

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "2"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      2) зачисление или перевод на счет денежных средств, предоставление или
      получение кредита (займа), операции с ценными бумагами, операции
      с цифровыми валютами или цифровыми правами в случае, если хотя бы одной
      из сторон является физическое или юридическое лицо, имеющее соответственно
      регистрацию, место жительства, место нахождения в государстве
      (на территории), которое (которая) не выполняет рекомендации Группы
      разработки финансовых мер борьбы с отмыванием денег (ФАТФ), либо если такие
      операции проводятся с использованием счета в банке, зарегистрированном
      в указанном государстве (на указанной территории), либо если операции
      с цифровыми валютами или цифровыми правами проводятся с использованием
      счета или адреса-идентификатора, администрируемого организацией
      финансового рынка, зарегистрированной в указанном государстве
      (на указанной территории). Перечень указанных государств (территорий)
      определяется в порядке, устанавливаемом Правительством Российской
      Федерации с учетом документов, издаваемых Группой разработки финансовых
      мер борьбы с отмыванием денег (ФАТФ), и подлежит опубликованию;

  - act: "115-ФЗ"
    article: "6"
    point: "1.12"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «в»"
    text: >-
      1.12. Операция с цифровыми валютами, цифровыми правами, используемыми
      в качестве встречного предоставления по внешнеторговым договорам
      (контрактам), которые заключены между резидентами и нерезидентами
      и предусматривают передачу товаров, выполнение работ, оказание услуг,
      передачу информации и результатов интеллектуальной деятельности, в том
      числе исключительных прав на них, подлежит обязательному контролю в случае,
      если сумма, на которую она совершается, равна или превышает 10 миллионов
      рублей.

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "8"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      8) купля-продажа цифровых валют, за исключением операций с цифровыми
      валютами, стороной по которым является центральный контрагент;

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "9"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      9) приобретение цифровых прав при их размещении, а также погашение
      цифровых прав;

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "10"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      10) зачисление на адрес-идентификатор, администрируемый цифровым
      депозитарием, цифровых валют (цифровых прав) с адреса-идентификатора,
      не администрируемого цифровым депозитарием;

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "11"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      11) перечисление с адреса-идентификатора, администрируемого цифровым
      депозитарием, цифровых валют (цифровых прав) на адрес-идентификатор,
      не администрируемый цифровым депозитарием.

  - act: "115-ФЗ"
    article: "5"
    article_title: "Организации, осуществляющие операции с денежными средствами или иным имуществом"
    source: "283-ФЗ, ст. 7 п. 3 подп. «б»"
    text: >-
      организации, осуществляющие обмен цифровых валют; цифровые депозитарии.
    note: >-
      Дополнение части первой статьи 5 двумя абзацами. Полный перечень субъектов
      антиотмывочного контроля 283-ФЗ не излагает.

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    article_title: "Дополнительные права и обязанности цифрового депозитария, оператора информационной системы, в которой осуществляется выпуск цифровых финансовых активов, профессионального участника рынка ценных бумаг, осуществляющего брокерскую деятельность, при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      1. Цифровой депозитарий, осуществляющий исполнение поручения клиента
      (предоставляющий согласие клиенту) на совершение операции с цифровыми
      валютами или цифровыми правами, оператор информационной системы, в которой
      осуществляется выпуск цифровых финансовых активов, если сумма операции
      с цифровыми валютами или цифровыми правами превышает в эквиваленте
      60 000 рублей, обязаны на всех этапах обеспечить контроль наличия, полноту
      и передачу с применением мер защиты в составе поручения или иным способом
      цифровому депозитарию, обслуживающему получателя цифровых валют или
      цифровых прав, оператору информационной системы, в которой осуществляется
      выпуск цифровых финансовых активов, или организации финансового рынка,
      расположенной за пределами территории Российской Федерации, обслуживающей
      получателя цифровых валют или цифровых прав, а также хранение
      в соответствии с пунктом 4 статьи 7 настоящего Федерального закона
      следующих сведений:

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    subpoint: "2"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      2) о плательщике — юридическом лице: наименования, номера цифрового счета
      или адреса-идентификатора, адреса юридического лица и идентификационного
      номера налогоплательщика;

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    subpoint: "4"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      4) о получателе — юридическом лице: наименования, номера цифрового счета
      или адреса-идентификатора, наименования государства и города (иной
      административно-территориальной единицы) местонахождения,
      идентификационного номера налогоплательщика (при наличии).

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "5"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      5. При отсутствии в поручении клиента сведений, указанных в пунктах 1 и 2
      настоящей статьи, или неполучении иным способом указанных сведений
      цифровой депозитарий обязан отказать в исполнении поручения клиента
      (в предоставлении согласия клиенту) на совершение операции с цифровыми
      валютами или цифровыми правами, а оператор информационной системы,
      в которой осуществляется выпуск цифровых финансовых активов, обязан
      исключить возможность распоряжения таким клиентом цифровыми правами
      в информационной системе данного оператора.

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "9"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      9. Цифровой депозитарий, оператор информационной системы, в которой
      осуществляется выпуск цифровых финансовых активов, обслуживающие
      получателя цифровых валют или цифровых прав, участвующие в осуществлении
      операций с цифровыми валютами или цифровыми правами, вправе отклонить
      проведение операции с цифровыми валютами или цифровыми правами либо
      обеспечить непроведение операции с цифровыми валютами или цифровыми
      правами, зачисленными на цифровой счет или адрес-идентификатор клиента,
      администрируемый цифровым депозитарием, в случае неполучения или получения
      не в полном объеме сведений, указанных в пункте 1 или 2 настоящей статьи.

  - act: "115-ФЗ"
    article: "7"
    point: "2"
    article_title: "Права и обязанности организаций, осуществляющих операции с денежными средствами или иным имуществом"
    source: ""
    text: ""
    note: >-
      Правило THR-003 ссылается на пункт 2 статьи 7: основания документального
      фиксирования необычных операций, включая уклонение от обязательного
      контроля. 283-ФЗ пункт 2 не излагает целиком: подпункт «ж» пункта 5
      статьи 7 № 283-ФЗ правит только абзац шестнадцатый (перечень организаций
      в этом пункте). Консолидированный текст пункта 2 на дату сборки не
      выверен. Пересказывать его нельзя.

  - act: "115-ФЗ"
    article: "7"
    point: "5.2-1"
    article_title: "Права и обязанности организаций, осуществляющих операции с денежными средствами или иным имуществом"
    source: "283-ФЗ, ст. 7 п. 5 подп. «з»"
    text: >-
      5.2-1. Цифровые депозитарии вправе: отказаться от заключения договора
      цифрового учета (договора о предоставлении доступа к адресу-идентификатору)
      в соответствии с правилами внутреннего контроля таких цифровых депозитариев
      в случае наличия подозрений в том, что целью заключения этого договора
      является совершение операций в целях легализации (отмывания) доходов,
      полученных преступным путем, или финансирования терроризма; расторгнуть
      договор цифрового учета (договор о предоставлении доступа к
      адресу-идентификатору) с клиентом в случае принятия в соответствии
      с правилами внутреннего контроля таких цифровых депозитариев в течение
      календарного года двух и более решений об отказе в совершении операции
      в случае, предусмотренном пунктом 11 настоящей статьи. Отказ от заключения
      договора цифрового учета (договора о предоставлении доступа к
      адресу-идентификатору) и расторжение договора цифрового учета (договора
      о предоставлении доступа к адресу-идентификатору) по основаниям, указанным
      в абзацах втором и третьем настоящего пункта, не являются основаниями
      возникновения гражданско-правовой ответственности цифрового депозитария
      за совершение соответствующих действий. Решение об отказе от заключения
      договора цифрового учета (договора о предоставлении доступа к
      адресу-идентификатору) или о расторжении договора цифрового учета
      (договора о предоставлении доступа к адресу-идентификатору) в соответствии
      с абзацами вторым и третьим настоящего пункта принимается руководителем
      цифрового депозитария или специально уполномоченными им лицами.

  - act: "115-ФЗ"
    article: "7"
    point: "5.2-2"
    article_title: "Права и обязанности организаций, осуществляющих операции с денежными средствами или иным имуществом"
    source: "283-ФЗ, ст. 7 п. 5 подп. «з»"
    text: >-
      5.2-2. Цифровым депозитариям, операторам информационных систем, в которых
      осуществляется выпуск цифровых финансовых активов, запрещается открывать
      цифровые счета, предоставлять доступ к адресам-идентификаторам анонимным
      лицам, вести цифровые счета анонимных лиц, то есть без предоставления
      физическим или юридическим лицом, иностранной структурой без образования
      юридического лица документов и сведений, необходимых для их идентификации,
      а также открывать цифровые счета, предоставлять доступ к
      адресам-идентификаторам, на которых учитываются цифровые валюты и (или)
      цифровые права, лицам, использующим вымышленные имена (псевдонимы), вести
      цифровые счета указанных лиц.

  - act: "115-ФЗ"
    article: "7"
    point: "16"
    article_title: "Права и обязанности организаций, осуществляющих операции с денежными средствами или иным имуществом"
    source: "283-ФЗ, ст. 7 п. 5 подп. «п»"
    text: >-
      16. Цифровым депозитариям, операторам информационных систем, в которых
      осуществляется выпуск цифровых финансовых активов, запрещается осуществлять
      перевод (предоставлять согласие на перевод) цифровых валют и (или)
      обеспечивать переход цифровых прав на адреса-идентификаторы,
      администрирование которых не осуществляется ни одним из цифровых
      депозитариев, в пользу следующих лиц: 1) организаций или физических лиц,
      включенных в перечень организаций и физических лиц, в отношении которых
      имеются сведения об их причастности к экстремистской деятельности или
      терроризму; 2) организаций или физических лиц, в отношении которых
      в соответствии с пунктом 1 статьи 7.4 настоящего Федерального закона
      межведомственным координационным органом, осуществляющим функции
      по противодействию финансированию терроризма и экстремистской деятельности,
      принято решение о замораживании (блокировании) денежных средств или иного
      имущества; 3) организаций или физических лиц, включенных в перечни
      организаций и физических лиц, связанных с терроризмом или с распространением
      оружия массового уничтожения, составляемые в соответствии с решениями
      Совета Безопасности ООН.

  # --- 173-ФЗ ---
  - act: "173-ФЗ"
    article: "1"
    part: "1"
    article_title: "Основные понятия, используемые в настоящем Федеральном законе"
    source: "283-ФЗ, ст. 12 п. 1 подп. «а»"
    text: >-
      Пункт 5 части 1 статьи 1 после слов «внешние ценные бумаги,» дополнен
      словами «цифровые валюты,». Пункт 4.1 части 1 статьи 1 изложен в новой
      редакции, разделяющей цифровые права на являющиеся и не являющиеся
      валютными ценностями.
    note: >-
      Приведена вносимая формулировка, а не консолидированный текст пункта 5:
      действующая редакция 173-ФЗ на дату сборки корпуса не выверена. Правовое
      следствие поправки — отнесение цифровых валют к валютным ценностям.

  - act: "173-ФЗ"
    article: "12.1"
    part: "1"
    article_title: "Отчеты о совершении операций с цифровыми валютами с использованием адресов-идентификаторов, не администрируемых цифровыми депозитариями"
    source: "283-ФЗ, ст. 12 п. 8"
    text: >-
      1. Резиденты открывают без ограничений адреса-идентификаторы,
      не администрируемые цифровыми депозитариями.

  - act: "173-ФЗ"
    article: "12.1"
    part: "2"
    article_title: "Отчеты о совершении операций с цифровыми валютами с использованием адресов-идентификаторов, не администрируемых цифровыми депозитариями"
    source: "283-ФЗ, ст. 12 п. 8"
    text: >-
      2. Резиденты, за исключением лиц, организующих обращение цифровых валют,
      физических лиц — резидентов, дипломатических представительств, консульских
      учреждений Российской Федерации, постоянных представительств Российской
      Федерации при международных (межгосударственных, межправительственных)
      организациях, иных официальных представительств Российской Федерации
      и представительств федеральных органов исполнительной власти, находящихся
      за пределами территории Российской Федерации, представляют в налоговые
      органы по месту своего учета отчеты о совершении операций с цифровыми
      валютами с использованием адресов-идентификаторов, не администрируемых
      цифровыми депозитариями, с приложением подтверждающих документов
      в порядке, устанавливаемом Правительством Российской Федерации
      по согласованию с Центральным банком Российской Федерации.
    note: >-
      Абзацы четвёртый — девятый пункта 8 статьи 12 № 283-ФЗ вступают в силу
      по истечении двухсот семидесяти дней после официального опубликования
      (ст. 23 ч. 3 № 283-ФЗ; по Контур.Норматив — 02.05.2027). Пункт 8 вводит
      статью 12.1. При счёте абзацев пункта (вводные слова, наименование статьи,
      затем части 1–7) отложены части 2–7: обязанность юрлица представлять
      отчёты, отчёты физлиц, выбор инспекции, международная группа компаний,
      изъятия и передача сведений в Банк России. Часть 1 (открытие адресов
      без ограничений) относится к абзацам, вступающим 01.09.2026. Порядок
      представления отчётов устанавливает Правительство по согласованию с ЦБ;
      постановления на дату сборки нет.

  - act: "173-ФЗ"
    article: "19"
    part: "9"
    article_title: "Репатриация резидентами иностранной валюты и валюты Российской Федерации"
    source: "283-ФЗ, ст. 12 п. 11"
    text: >-
      9. Правительством Российской Федерации по согласованию с Центральным
      банком Российской Федерации может быть установлено требование
      о репатриации цифровых валют и цифровых прав.

  - act: "173-ФЗ"
    article: "23"
    part: "18"
    article_title: "Права и обязанности органов и агентов валютного контроля и их должностных лиц"
    source: "283-ФЗ, ст. 12 п. 13 подп. «б»"
    text: >-
      18. Центральный банк Российской Федерации вправе установить порядок
      представления резидентами подтверждающих документов и информации при
      осуществлении валютных операций с цифровыми валютами и цифровыми правами.

  # --- Инструкция Банка России № 181-И ---
  # Пороги постановки на учёт: Указание Банка России от 06.08.2024 № 6819-У
  # (Минюст 08.11.2024 № 80086), п. 1.6–1.8. «Контракт ЦП» — расчёты цифровыми
  # правами, не цифровой валютой. Указание от 31.03.2026 № 7333-У эти цифры
  # не переписывает.
  - act: "181-И"
    article: "4.2"
    article_title: "Общие положения (учёт контрактов)"
    source: "Указание Банка России от 06.08.2024 № 6819-У, п. 1.6"
    text: >-
      4.2. Положения настоящего раздела распространяются на контракты ЦП.

  - act: "181-И"
    article: "4.3"
    article_title: "Общие положения (учёт контрактов)"
    source: "Указание Банка России от 06.08.2024 № 6819-У, п. 1.7"
    text: >-
      4.3. Сумма обязательств по контрактам (кредитным договорам), указанным
      в пункте 4.1 настоящей Инструкции, по контрактам ЦП должна быть равна
      или превышать эквивалент: для импортных контрактов (импортных контрактов
      ЦП) или кредитных договоров — 3 млн рублей; для экспортных контрактов
      (экспортных контрактов ЦП) — 10 млн рублей. Сумма обязательств по
      контракту (кредитному договору), указанному в пункте 4.1 настоящей
      Инструкции, по контракту ЦП определяется на дату заключения контракта
      (кредитного договора) либо в случае изменения суммы обязательств по
      контракту (кредитному договору) на дату заключения последних изменений
      (дополнений) к контракту (кредитному договору), предусматривающих такое
      изменение суммы по курсу иностранных валют по отношению к рублю.
    note: >-
      Порог 3 млн рублей — импортный контракт и импортный контракт ЦП.
      Порог 10 млн рублей — экспорт. «Контракт ЦП» — средство платежа цифровыми
      правами. Расчёты цифровой валютой инструкция этими пунктами прямо не
      называет: порядок документов по ним Банк России вправе установить
      по части 18 статьи 23 № 173-ФЗ. Проект инструкции взамен 181-И
      (07.08.2026) на дату сборки не вступил. К внешнеторговому импортному
      контракту как к объекту учёта применяется порог пункта 4.3.

  - act: "181-И"
    article: "5.1"
    article_title: "Учёт контрактов (кредитных договоров)"
    source: "Указание Банка России от 06.08.2024 № 6819-У, п. 1.8"
    text: >-
      5.1. Резидент, являющийся стороной по экспортному контракту, экспортному
      контракту ЦП (далее — резидент-экспортер), по импортному контракту,
      импортному контракту ЦП (далее — резидент-импортер) либо по кредитному
      договору, указанному в главе 4 настоящей Инструкции, должен осуществить
      их постановку на учет в уполномоченном банке в порядке, установленном
      настоящей главой.
    note: >-
      Приведена редакция абзаца первого пункта 5.1. Полный текст последующих
      абзацев того же пункта в выгрузке не собран.
