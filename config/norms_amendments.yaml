# Нормы № 115-ФЗ и № 173-ФЗ в редакции Федерального закона от 04.08.2026 № 283-ФЗ.
#
# Тексты 282-ФЗ разбираются автоматически из выгрузки закона, а эти два акта
# 283-ФЗ правит, а не излагает целиком: в его тексте есть только вносимые
# формулировки. Поэтому нормы выверены вручную по тексту 283-ФЗ и приведены
# здесь дословно.
#
# Записи без текста означают признанный пробел корпуса: норма процитирована
# в матрице, но её текст не выверен. Пересказывать норму по памяти нельзя.

norms:
  # --- 115-ФЗ ---
  - act: "115-ФЗ"
    article: "3"
    part: "7-8"
    article_title: "Основные понятия, используемые в настоящем Федеральном законе"
    source: "283-ФЗ, ст. 7 п. 1 подп. «б»"
    text: >-
      Используемые в настоящем Федеральном законе понятия «адрес-идентификатор»,
      «цифровые валюты», «иностранные цифровые инструменты», «договор цифрового
      учета», «договор о предоставлении доступа к адресу-идентификатору»
      применяются в тех значениях, в каких они используются в законодательстве
      Российской Федерации о цифровых валютах и цифровых правах. Для целей
      настоящего Федерального закона к иностранным цифровым инструментам
      применяются положения, установленные в отношении цифровых валют.

  - act: "115-ФЗ"
    article: "6"
    point: "1"
    subpoint: "2"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «а»"
    text: >-
      2) зачисление или перевод на счет денежных средств, предоставление или
      получение кредита (займа), операции с ценными бумагами, операции
      с цифровыми валютами или цифровыми правами в случае, если хотя бы одной
      из сторон является физическое или юридическое лицо, имеющее соответственно
      регистрацию, место жительства, место нахождения в государстве
      (на территории), которое (которая) не выполняет рекомендации Группы
      разработки финансовых мер борьбы с отмыванием денег (ФАТФ), либо если такие
      операции проводятся с использованием счета в банке, зарегистрированном
      в указанном государстве (на указанной территории), либо если операции
      с цифровыми валютами или цифровыми правами проводятся с использованием
      счета или адреса-идентификатора, администрируемого организацией
      финансового рынка, зарегистрированной в указанном государстве
      (на указанной территории). Перечень указанных государств (территорий)
      определяется в порядке, устанавливаемом Правительством Российской
      Федерации с учетом документов, издаваемых Группой разработки финансовых
      мер борьбы с отмыванием денег (ФАТФ), и подлежит опубликованию;

  - act: "115-ФЗ"
    article: "6"
    point: "1.12"
    article_title: "Операции с денежными средствами или иным имуществом, подлежащие обязательному контролю"
    source: "283-ФЗ, ст. 7 п. 4 подп. «в»"
    text: >-
      1.12. Операция с цифровыми валютами, цифровыми правами, используемыми
      в качестве встречного предоставления по внешнеторговым договорам
      (контрактам), которые заключены между резидентами и нерезидентами
      и предусматривают передачу товаров, выполнение работ, оказание услуг,
      передачу информации и результатов интеллектуальной деятельности, в том
      числе исключительных прав на них, подлежит обязательному контролю в случае,
      если сумма, на которую она совершается, равна или превышает 10 миллионов
      рублей.

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    article_title: "Дополнительные права и обязанности цифрового депозитария, оператора информационной системы, в которой осуществляется выпуск цифровых финансовых активов, профессионального участника рынка ценных бумаг, осуществляющего брокерскую деятельность, при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      1. Цифровой депозитарий, осуществляющий исполнение поручения клиента
      (предоставляющий согласие клиенту) на совершение операции с цифровыми
      валютами или цифровыми правами, оператор информационной системы, в которой
      осуществляется выпуск цифровых финансовых активов, если сумма операции
      с цифровыми валютами или цифровыми правами превышает в эквиваленте
      60 000 рублей, обязаны на всех этапах обеспечить контроль наличия, полноту
      и передачу с применением мер защиты в составе поручения или иным способом
      цифровому депозитарию, обслуживающему получателя цифровых валют или
      цифровых прав, оператору информационной системы, в которой осуществляется
      выпуск цифровых финансовых активов, или организации финансового рынка,
      расположенной за пределами территории Российской Федерации, обслуживающей
      получателя цифровых валют или цифровых прав, а также хранение
      в соответствии с пунктом 4 статьи 7 настоящего Федерального закона
      следующих сведений:

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    subpoint: "2"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      2) о плательщике — юридическом лице: наименования, номера цифрового счета
      или адреса-идентификатора, адреса юридического лица и идентификационного
      номера налогоплательщика;

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "1"
    subpoint: "4"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      4) о получателе — юридическом лице: наименования, номера цифрового счета
      или адреса-идентификатора, наименования государства и города (иной
      административно-территориальной единицы) местонахождения,
      идентификационного номера налогоплательщика (при наличии).

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "5"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      5. При отсутствии в поручении клиента сведений, указанных в пунктах 1 и 2
      настоящей статьи, или неполучении иным способом указанных сведений
      цифровой депозитарий обязан отказать в исполнении поручения клиента
      (в предоставлении согласия клиенту) на совершение операции с цифровыми
      валютами или цифровыми правами, а оператор информационной системы,
      в которой осуществляется выпуск цифровых финансовых активов, обязан
      исключить возможность распоряжения таким клиентом цифровыми правами
      в информационной системе данного оператора.

  - act: "115-ФЗ"
    article: "7.2-1"
    point: "9"
    article_title: "Дополнительные права и обязанности цифрового депозитария при осуществлении операций с цифровыми валютами или цифровыми правами"
    source: "283-ФЗ, ст. 7 п. 6"
    text: >-
      9. Цифровой депозитарий, оператор информационной системы, в которой
      осуществляется выпуск цифровых финансовых активов, обслуживающие
      получателя цифровых валют или цифровых прав, участвующие в осуществлении
      операций с цифровыми валютами или цифровыми правами, вправе отклонить
      проведение операции с цифровыми валютами или цифровыми правами либо
      обеспечить непроведение операции с цифровыми валютами или цифровыми
      правами, зачисленными на цифровой счет или адрес-идентификатор клиента,
      администрируемый цифровым депозитарием, в случае неполучения или получения
      не в полном объеме сведений, указанных в пункте 1 или 2 настоящей статьи.

  - act: "115-ФЗ"
    article: "7"
    article_title: "Права и обязанности организаций, осуществляющих операции с денежными средствами или иным имуществом"
    source: ""
    text: ""
    note: >-
      Статья процитирована в правиле THR-003 как общая норма о внутреннем
      контроле. Текст в корпус не включён: 283-ФЗ эту статью в проверенной части
      не изменяет, а действующая редакция не выверена. Требуется сверка
      по действующей редакции 115-ФЗ.

  # --- 173-ФЗ ---
  - act: "173-ФЗ"
    article: "1"
    part: "1"
    article_title: "Основные понятия, используемые в настоящем Федеральном законе"
    source: "283-ФЗ, ст. 12 п. 1 подп. «а»"
    text: >-
      Пункт 5 части 1 статьи 1 после слов «внешние ценные бумаги,» дополнен
      словами «цифровые валюты,». Пункт 4.1 части 1 статьи 1 изложен в новой
      редакции, разделяющей цифровые права на являющиеся и не являющиеся
      валютными ценностями.
    note: >-
      Приведена вносимая формулировка, а не консолидированный текст пункта 5:
      действующая редакция 173-ФЗ на дату сборки корпуса не выверена. Правовое
      следствие поправки — отнесение цифровых валют к валютным ценностям.

  - act: "173-ФЗ"
    article: "12.1"
    part: "1"
    article_title: "Отчеты о совершении операций с цифровыми валютами с использованием адресов-идентификаторов, не администрируемых цифровыми депозитариями"
    source: "283-ФЗ, ст. 12 п. 8"
    text: >-
      1. Резиденты открывают без ограничений адреса-идентификаторы,
      не администрируемые цифровыми депозитариями.

  - act: "173-ФЗ"
    article: "12.1"
    part: "2"
    article_title: "Отчеты о совершении операций с цифровыми валютами с использованием адресов-идентификаторов, не администрируемых цифровыми депозитариями"
    source: "283-ФЗ, ст. 12 п. 8"
    text: >-
      2. Резиденты, за исключением лиц, организующих обращение цифровых валют,
      физических лиц — резидентов, дипломатических представительств, консульских
      учреждений Российской Федерации, постоянных представительств Российской
      Федерации при международных (межгосударственных, межправительственных)
      организациях, иных официальных представительств Российской Федерации
      и представительств федеральных органов исполнительной власти, находящихся
      за пределами территории Российской Федерации, представляют в налоговые
      органы по месту своего учета отчеты о совершении операций с цифровыми
      валютами с использованием адресов-идентификаторов, не администрируемых
      цифровыми депозитариями, с приложением подтверждающих документов
      в порядке, устанавливаемом Правительством Российской Федерации
      по согласованию с Центральным банком Российской Федерации.
    note: >-
      Часть абзацев статьи 12.1 вступает в силу со 02.05.2027 (статья 23
      № 283-ФЗ). Точное распределение абзацев по частям статьи требует сверки.

  - act: "173-ФЗ"
    article: "19"
    part: "9"
    article_title: "Репатриация резидентами иностранной валюты и валюты Российской Федерации"
    source: "283-ФЗ, ст. 12 п. 11"
    text: >-
      9. Правительством Российской Федерации по согласованию с Центральным
      банком Российской Федерации может быть установлено требование
      о репатриации цифровых валют и цифровых прав.

  - act: "173-ФЗ"
    article: "23"
    part: "18"
    article_title: "Права и обязанности органов и агентов валютного контроля и их должностных лиц"
    source: "283-ФЗ, ст. 12 п. 13 подп. «б»"
    text: >-
      18. Центральный банк Российской Федерации вправе установить порядок
      представления резидентами подтверждающих документов и информации при
      осуществлении валютных операций с цифровыми валютами и цифровыми правами.

  # --- Инструкция Банка России ---
  - act: "181-И"
    article: "требует сверки редакции"
    article_title: "Инструкция Банка России от 16.08.2017 № 181-И"
    source: ""
    text: ""
    note: >-
      Порог постановки контракта на учёт взят из практики и требует сверки
      с действующей редакцией инструкции с учётом поправок № 283-ФЗ. До сверки
      правило THR-002 применяется, но текст нормы в заключении не цитируется.
