# Перечень для правила AML-002.
#
# Подпункт 2 пункта 1 статьи 6 № 115-ФЗ в редакции 283-ФЗ: перечень государств
# (территорий), не выполняющих рекомендации ФАТФ, определяется в порядке,
# устанавливаемом Правительством Российской Федерации с учётом документов ФАТФ,
# и подлежит опубликованию. Новый перечень Правительства на 01.09.2026
# не найден. Приказ Росфинмониторинга от 10.11.2011 № 361 (постановление
# Правительства от 26.03.2003 № 173) — Иран и КНДР, без Мьянмы. Снимок ФАТФ
# «High-Risk Jurisdictions subject to a Call for Action» от 19 июня 2026 года
# включает ещё Мьянму. Снимок приказом не подменяется: это два разных акта.
#
# Серая зона ФАТФ (increased monitoring) в снимок не входит: норма говорит
# о государствах, которые не выполняют рекомендации, а не о государствах
# под усиленным наблюдением.

as_of: "2026-06-19"
source: "FATF, High-Risk Jurisdictions subject to a Call for Action, 19 June 2026"
source_url: "https://www.fatf-gafi.org/en/publications/High-risk-and-other-monitored-jurisdictions/call-for-action-june-2026.html"
rf_order_361:
  as_of: "2011-11-10"
  source: "Приказ Росфинмониторинга от 10.11.2011 № 361"
  note: "Иран и КНДР. Мьянма в приказе отсутствует."

jurisdictions:
  - iso2: KP
    in_rf_order_361: true
    names:
      - КНДР
      - Корейская Народно-Демократическая Республика
      - Северная Корея
      - DPRK
      - North Korea
      - Democratic People's Republic of Korea
  - iso2: IR
    in_rf_order_361: true
    names:
      - Иран
      - Ирана
      - Иране
      - Ираном
      - Исламская Республика Иран
      - Iran
  - iso2: MM
    in_rf_order_361: false
    names:
      - Мьянма
      - Мьянме
      - Мьянмы
      - Бирма
      - Myanmar
      - Burma
